# Port 80: ACME HTTP-01 challenges + redirect to HTTPS for every public name on path-rfs.
server {
    listen 80;
    listen [::]:80;
    server_name path2v2x.net www.path2v2x.net drive.path2v2x.net twin.path2v2x.net;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
