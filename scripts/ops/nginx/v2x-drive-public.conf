# path2v2x.net -> V2X Drive (path2v2x/v2x-drive) served from path-rfs.
# Installed by scripts/deploy.sh to /etc/nginx/sites-available/v2x-drive-public
# (symlinked into sites-enabled). The certificate is managed by certbot:
#   certbot certonly --nginx --cert-name drive.path2v2x.net --expand \
#     -d path2v2x.net -d www.path2v2x.net -d drive.path2v2x.net -d twin.path2v2x.net
map $http_origin $camera_cors_origin {
    default "";
    "https://path2v2x.net" $http_origin;
    "https://www.path2v2x.net" $http_origin;
    "https://drive.path2v2x.net" $http_origin;
    "https://twin.path2v2x.net" $http_origin;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.path2v2x.net;
    ssl_certificate /etc/letsencrypt/live/drive.path2v2x.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drive.path2v2x.net/privkey.pem;
    return 301 https://path2v2x.net$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name path2v2x.net drive.path2v2x.net;
    ssl_certificate /etc/letsencrypt/live/drive.path2v2x.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drive.path2v2x.net/privkey.pem;
    root /var/www/v2x-drive;
    index index.html;
    add_header X-Served-By path-rfs always;
    # CARLA drive server (apps/drive-server)
    location /ws {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    # MediaMTX low-latency HLS (live cameras)
    location /camera/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_redirect / /camera/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $camera_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 30s;
    }
    # MediaMTX playback server (72 h recording archive)
    location /archive/ {
        proxy_pass http://127.0.0.1:9996/;
        proxy_http_version 1.1;
        proxy_method GET;
        proxy_set_header Host $host;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $camera_cors_origin always;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 3600s;
    }
    # Twin server detection history (72 h SQLite on path-rfs)
    location /detections/ {
        proxy_pass http://127.0.0.1:8190/detections/;
        proxy_http_version 1.1;
        proxy_method GET;
        proxy_set_header Host $host;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $camera_cors_origin always;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 30s;
    }
    # Drive server publications: api/state.json, api/map-data.json, snapshots, demo videos
    location /data/api/ {
        alias /var/www/v2x-drive-data/api/;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin $camera_cors_origin always;
    }
    location /data/demo-videos/ {
        alias /var/www/v2x-drive-data/demo-videos/;
        autoindex on;
        autoindex_format json;
        add_header Access-Control-Allow-Origin $camera_cors_origin always;
    }
    location /data/ {
        alias /var/www/v2x-drive-data/;
        add_header Access-Control-Allow-Origin $camera_cors_origin always;
    }
    location = /config.json {
        add_header Cache-Control "no-cache" always;
    }
    location / {
        try_files $uri $uri.html /index.html;
    }
    # Co-perception live viewer (path2v2x/co-perception ws_broadcast_server, jpark)
    location = /perception {
        alias /var/www/v2x-perception/index.html;
        default_type text/html;
    }
    location /perception/ {
        alias /var/www/v2x-perception/;
        try_files $uri $uri.html /perception/index.html;
    }
    location /perception/ws {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
